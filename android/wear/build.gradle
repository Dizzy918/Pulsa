// Tactiq for Wear OS — standalone watch app.
// Lives inside the RN android build but is a plain Android application module.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.tactiq.wear"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // MUST match the phone app's applicationId — the Wear OS Data Layer only
        // delivers messages between apps with the same package name + signature.
        applicationId "com.tactiq.app"
        minSdkVersion 30 // Wear OS 3+ (Galaxy Watch4+, Pixel Watch, TicWatch…)
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.2.0"
    }

    signingConfigs {
        debug {
            // Reuse the phone app's debug keystore so Data Layer signature checks pass.
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug // replace with a real keystore for Play
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    // The TFLite model must not be zip-compressed inside the APK.
    androidResources { noCompress "tflite" }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.wear:wear:1.3.0"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    // Task library bundles YAMNet inference + AudioRecord plumbing.
    implementation "org.tensorflow:tensorflow-lite-task-audio:0.4.4"
}
